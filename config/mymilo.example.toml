# MyMilo example configuration. Copy to config/mymilo.toml and edit.
# Secrets NEVER go in this file — see vault/README.md.

[server]
host = "127.0.0.1"
port = 8090
request_timeout_s = 90.0

[database]
path = "data/mymilo.db"

# Model routes: name -> any OpenAI-compatible backend.
# Phase 1 default: llama.cpp directly (start: llama-server -m <model.gguf> --port 8080).
# Converged layering: the router + cost ledger live in the agentic OS; MyMilo
# becomes a client of the OS's OpenAI-compatible endpoint (see SPEC.md).
[[models]]
name = "local"
base_url = "http://127.0.0.1:8080/v1"
timeout_s = 60.0

# Example: point at the future OS endpoint instead of llama.cpp directly.
# [[models]]
# name = "os"
# base_url = "http://127.0.0.1:8091/v1"

# Example: cloud fallback. Key comes from the environment, never this file.
# [[models]]
# name = "cloud"
# base_url = "https://openrouter.ai/api/v1"
# api_key_env = "MYMILO_CLOUD_API_KEY"
# timeout_s = 120.0

# Embeddings for retrieval. Default is llama.cpp's OpenAI-compatible
# /embeddings endpoint — no heavy dependencies. Point `route` at whichever
# model route serves an embedding model, e.g.:
#   llama-server -m nomic-embed-text.gguf --embedding --port 8080
[embeddings]
backend = "llamacpp"   # llamacpp | sentence-transformers | hash (test only)
route = "local"
model = "embed"
timeout_s = 60.0
# st_model = "all-MiniLM-L6-v2"   # for backend = "sentence-transformers"
#                                 # (needs: pip install -e ".[rag]")

# Proactive engine (Phase 3): cron-driven routines, deterministic planner,
# consent-gated actions. Disable to run purely on-demand.
[scheduler]
enabled = true
tick_seconds = 30.0

# Fleet economics (Phase 4): per-route cost metadata. Local backends stay
# at the zero defaults. Paid routes declare USD per 1k tokens and an
# optional monthly free quota — the ledger flags 70% and 100% via the
# planner (suggestions, never blocks). Routing stays exact-name: nothing
# ever silently fails over to a paid route.
# [[models]]
# name = "cloud"
# base_url = "https://openrouter.ai/api/v1"
# api_key_env = "MYMILO_CLOUD_API_KEY"
# input_usd_per_1k = 0.15
# output_usd_per_1k = 0.60
# free_quota_usd = 10.0
