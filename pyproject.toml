[project]
name = "mymilo"
version = "0.2.0"
description = "MyMilo — Nrupal's native town-like buddy: the resident interface of his personal agentic OS."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Nrupal Akolkar" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pydantic>=2.0",
    "numpy>=1.24",
    "anyio>=4.0",
    "python-multipart>=0.0.18",  # file uploads (UploadFile)
    "python-docx>=1.1",  # export to Word
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]
# Retrieval extras: in-process embeddings + document parsers.
# The default path needs none of these (llama.cpp /embeddings + stdlib).
rag = [
    "sentence-transformers>=2.2.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.0",
    "markdown>=3.5.0",
]

[project.scripts]
mymilo = "app.main:run"

[tool.setuptools.packages.find]
# Flat-layout: only app/ is a Python package. Without this, setuptools
# auto-discovery chokes on data/, vault/, static/, config/, templates/.
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
