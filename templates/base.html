<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d5450">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<title>{% block title %}MyMilo{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <div class="brand">MyMilo <span class="ver">v{{ version }}</span></div>
  <nav><a href="/">Chat</a><a href="/documents">Documents</a><a href="/jobs">Routines</a><a href="/costs">Costs</a></nav>
  <div id="health" class="health" title="backend reachability">…</div>
</header>
<main>{% block content %}{% endblock %}</main>
<script>
async function refreshHealth() {
  const el = document.getElementById('health');
  try {
    const r = await fetch('/health');
    const h = await r.json();
    const parts = Object.entries(h.backends || {}).map(
      ([k, v]) => `${k}:${v ? 'up' : 'down'}`);
    el.textContent = parts.join(' · ') || 'no backends';
    el.classList.toggle('down', parts.some(p => p.endsWith('down')));
  } catch (e) { el.textContent = 'unreachable'; el.classList.add('down'); }
}
refreshHealth();
setInterval(refreshHealth, 15000);
</script>
{% block scripts %}{% endblock %}
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
