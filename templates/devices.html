<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MyMilo — Your devices</title>
<style>
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: #0e1116; color: #e8edf4; margin: 0; padding: 20px; }
  .card { max-width: 520px; margin: 24px auto; background: #171c24; border-radius: 14px; padding: 22px; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  p { color: #8b96a5; line-height: 1.5; font-size: 14px; }
  button { background: #4f8cff; color: #fff; border: 0; border-radius: 9px; padding: 11px 16px; font-size: 15px; font-weight: 600; cursor: pointer; }
  button.small { background: transparent; color: #4f8cff; border: 1px solid #4f8cff; font-weight: 400; padding: 6px 10px; font-size: 13px; margin-left: 8px; }
  button.danger { background: transparent; color: #ff5d5d; border: 1px solid #ff5d5d; font-weight: 400; padding: 6px 10px; font-size: 13px; margin-left: 8px; }
  button.armed { background: #ff5d5d; color: #fff; border: 1px solid #ff5d5d; }
  button.armed-blue { background: #4f8cff; color: #fff; }
  input.name { width: 100%; box-sizing: border-box; background: #1f2632; border: 1px solid #2c3646; border-radius: 9px; color: #e8edf4; font-size: 15px; padding: 11px 12px; margin: 10px 0; }
  .token-box { display: none; margin-top: 16px; background: #1f2632; border: 1px solid #2c3646; border-radius: 10px; padding: 14px; }
  .token-box code { word-break: break-all; font-size: 15px; color: #3ddc84; }
  .device { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #232b38; font-size: 14px; }
  .device .meta { color: #8b96a5; font-size: 12px; margin-top: 2px; }
  .device .actions { white-space: nowrap; }
  .warn { color: #ffb84f; }
  .empty { color: #8b96a5; font-size: 14px; padding: 14px 0; }
</style>
</head>
<body>
<div class="card">
  <h1>📱 Your devices</h1>
  <p>These are the phones connected to your MyMilo. If the app on a phone stops connecting, give that device a <b>new token</b> here — same device, fresh key, no new entries. Remove anything you don't recognize.</p>
  <input class="name" id="device-name" type="text" value="My Android phone" aria-label="Device name">
  <button id="register-btn">Connect a device</button>
  <div class="token-box" id="token-box">
    <p class="warn" id="token-title">Copy this token now — it won't be shown again:</p>
    <code id="token-text"></code><br><br>
    <button id="copy-btn">Copy token</button>
  </div>
  <div id="device-list" style="margin-top:18px"></div>
  <p><a href="/" style="color:#4f8cff">← Back to MyMilo</a></p>
</div>
<script>
function showToken(title, token) {
  document.getElementById('token-title').textContent = title;
  document.getElementById('token-text').textContent = token;
  document.getElementById('token-box').style.display = 'block';
  document.getElementById('token-box').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function ago(ts) {
  if (!ts) return 'never used';
  const days = Math.floor((Date.now() / 1000 - ts) / 86400);
  if (days <= 0) return 'used today';
  if (days === 1) return 'used yesterday';
  return 'used ' + days + ' days ago';
}

// Two-tap inline confirm: first tap arms the button with the
// consequence written on it; second tap within 4s does the action.
// No pop-ups, nothing to misread.
function arm(btn, armedLabel, armedClass, action) {
  if (btn.dataset.armed === '1') { action(); return; }
  const original = btn.textContent;
  btn.dataset.armed = '1';
  btn.textContent = armedLabel;
  btn.classList.add(armedClass);
  setTimeout(() => {
    btn.dataset.armed = '';
    btn.textContent = original;
    btn.classList.remove(armedClass);
  }, 4000);
}

async function loadDevices() {
  const r = await fetch('/v1/devices');
  const j = await r.json();
  const list = document.getElementById('device-list');
  list.innerHTML = '';
  const devices = j.devices || [];
  if (devices.length === 0) {
    const div = document.createElement('div');
    div.className = 'empty';
    div.textContent = 'No devices yet. Name your phone above and tap “Connect a device”, then paste the token into the app.';
    list.appendChild(div);
    return;
  }
  devices.forEach(d => {
    const div = document.createElement('div');
    div.className = 'device';
    const left = document.createElement('span');
    const title = document.createElement('div');
    title.textContent = d.name || 'Device';
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = (d.platform || 'phone') + ' · ' +
      (d.revoked ? 'disconnected' : 'connected · ' + ago(d.last_seen_at));
    left.appendChild(title);
    left.appendChild(meta);
    div.appendChild(left);
    const actions = document.createElement('span');
    actions.className = 'actions';
    if (!d.revoked) {
      const rotate = document.createElement('button');
      rotate.className = 'small';
      rotate.textContent = 'New token';
      rotate.onclick = () => arm(rotate, 'Old token stops working — tap again', 'armed-blue', () => rotateDevice(d));
      actions.appendChild(rotate);
      const revoke = document.createElement('button');
      revoke.className = 'danger';
      revoke.textContent = 'Disconnect';
      revoke.onclick = () => arm(revoke, 'Tap again to disconnect', 'armed', () => revokeDevice(d));
      actions.appendChild(revoke);
    } else {
      const remove = document.createElement('button');
      remove.className = 'danger';
      remove.textContent = 'Remove';
      remove.onclick = () => arm(remove, 'Tap again to remove for good', 'armed', () => removeDevice(d));
      actions.appendChild(remove);
    }
    div.appendChild(actions);
    list.appendChild(div);
  });
}

async function rotateDevice(d) {
  const name = d.name || 'this device';
  const r = await fetch('/v1/devices/' + d.id + '/rotate', { method: 'POST' });
  const j = await r.json();
  if (j.token) {
    showToken('New token for ' + name + ' — paste it into the app. The old token has stopped working, and this one won\'t be shown again:', j.token);
    loadDevices();
  } else {
    alert('Could not make a new token: ' + (j.detail || 'unknown error'));
  }
}

async function revokeDevice(d) {
  await fetch('/v1/devices/' + d.id, { method: 'DELETE' });
  loadDevices();
}

async function removeDevice(d) {
  const r = await fetch('/v1/devices/' + d.id + '/remove', { method: 'POST' });
  if (!r.ok) {
    const j = await r.json().catch(() => ({}));
    alert('Could not remove: ' + (j.detail || 'unknown error'));
  }
  loadDevices();
}

document.getElementById('register-btn').onclick = async () => {
  const name = document.getElementById('device-name').value.trim() || 'My Android phone';
  const r = await fetch('/v1/devices/register', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, platform: 'android' })
  });
  const j = await r.json();
  if (j.token) {
    showToken('Copy this token now — paste it into the app on ' + name + '. It won\'t be shown again:', j.token);
    loadDevices();
  } else {
    alert('Could not connect the device: ' + (j.detail || 'unknown error'));
  }
};
document.getElementById('copy-btn').onclick = async () => {
  const t = document.getElementById('token-text').textContent;
  const btn = document.getElementById('copy-btn');
  try { await navigator.clipboard.writeText(t); btn.textContent = 'Copied ✓'; } catch { btn.textContent = 'Long-press the token to copy'; }
  setTimeout(() => { btn.textContent = 'Copy token'; }, 2500);
};
loadDevices();
</script>
</body>
</html>
