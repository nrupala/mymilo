{% extends "base.html" %}
{% block title %}MyMilo — Chat{% endblock %}
{% block content %}
<div class="chat-wrap">
  <div class="controls">
    <label>Model
      <select id="model"><option>loading…</option></select>
    </label>
    <label title="Retrieve relevant document chunks and cite them">
      <input type="checkbox" id="userag"> Use documents
    </label>
    <button id="clear">Clear</button>
  </div>
  <div id="log" class="log" aria-live="polite"></div>
  <form id="form" class="composer">
    <textarea id="input" rows="3" placeholder="Talk to your Milo…" required></textarea>
    <button type="button" id="mic" title="Dictate" aria-label="Dictate">🎙</button>
    <button type="submit">Send</button>
  </form>
</div>
{% endblock %}
{% block scripts %}
<script>
const log = document.getElementById('log');
const form = document.getElementById('form');
const input = document.getElementById('input');
const modelSel = document.getElementById('model');

async function loadModels() {
  try {
    const r = await fetch('/v1/models');
    const j = await r.json();
    modelSel.innerHTML = '';
    (j.data || []).forEach(m => {
      const o = document.createElement('option');
      o.value = m.id; o.textContent = m.id;
      modelSel.appendChild(o);
    });
  } catch (e) { modelSel.innerHTML = '<option>sign-in required</option>'; }
}
loadModels();

function addMsg(role, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  const who = document.createElement('div');
  who.className = 'who'; who.textContent = role === 'user' ? 'You' : 'MyMilo';
  const body = document.createElement('div');
  body.className = 'body'; body.textContent = text;
  d.append(who, body);
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}

const micBtn = document.getElementById('mic');
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SpeechRec) {
  micBtn.style.display = 'none'; // no voice input on this browser
} else {
  const rec = new SpeechRec();
  rec.lang = 'en-US';
  rec.interimResults = true;
  rec.continuous = false;
  let baseText = '';
  rec.onresult = (event) => {
    let interim = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const transcript = event.results[i][0].transcript;
      if (event.results[i].isFinal) baseText += transcript + ' ';
      else interim += transcript;
    }
    input.value = (baseText + interim).trim();
  };
  const stopUi = () => { micBtn.classList.remove('rec'); micBtn.textContent = '🎙'; };
  rec.onend = stopUi;
  rec.onerror = stopUi;
  micBtn.addEventListener('click', () => {
    if (micBtn.classList.contains('rec')) { rec.stop(); return; }
    baseText = input.value ? input.value.replace(/\s+$/, '') + ' ' : '';
    input.value = baseText;
    micBtn.classList.add('rec');
    micBtn.textContent = '⏹';
    try { rec.start(); } catch (e) { stopUi(); }
  });
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  addMsg('user', text);
  addMsg('assistant', '…');
  const thinking = log.lastChild;
  const body = {
    model: modelSel.value,
    messages: [{role: 'user', content: text}],
  };
  if (document.getElementById('userag').checked) {
    body.rag = {enabled: true, top_k: 5};
  }
  try {
    const r = await fetch('/v1/chat/completions', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body),
    });
    const j = await r.json();
    thinking.remove();
    if (!r.ok) {
      addMsg('assistant', 'Error: ' + (j.error ? j.error.message : r.status));
    } else {
      const c = (j.choices && j.choices[0] && j.choices[0].message) || {};
      let out = c.content || JSON.stringify(j);
      if (j.citation_check && !j.citation_check.ok) {
        out += '\n\n⚠ unverified citations: ' +
          j.citation_check.unresolved.map(u => `${u.filename} chunk ${u.chunk}`).join(', ');
      }
      addMsg('assistant', out);
    }
  } catch (err) {
    thinking.remove();
    addMsg('assistant', /sign-in required/i.test(err.message || '') ? err.message : 'Request failed: ' + err.message);
  }
});

document.getElementById('clear').addEventListener('click', () => { log.innerHTML = ''; });
</script>
{% endblock %}
