{% extends "base.html" %}
{% block title %}MyMilo — Chat{% endblock %}
{% block content %}
<div class="chat-wrap">
  <div class="chat-toolbar">
    <select id="sessionSel" title="Past chats" aria-label="Past chats">
      <option value="">＋ New chat</option>
    </select>
    <select id="model" title="Model" aria-label="Model"><option>loading…</option></select>
    <div class="toolbar-spacer"></div>
    <label class="docs-toggle" title="Retrieve relevant document chunks and cite them">
      <input type="checkbox" id="userag"> Docs
    </label>
    <button id="clear" title="New chat" aria-label="New chat">＋</button>
  </div>
  <div id="log" class="log" aria-live="polite"></div>
  <form id="form" class="composer">
    <textarea id="input" rows="3" placeholder="Talk to MyMilo…" required></textarea>
    <button type="button" id="mic" title="Dictate" aria-label="Dictate">🎙</button>
    <button type="submit">Send</button>
  </form>
</div>
{% endblock %}
{% block scripts %}
<script>
const log = document.getElementById('log');
const form = document.getElementById('form');
const input = document.getElementById('input');
const modelSel = document.getElementById('model');

async function loadModels() {
  try {
    const r = await fetch('/v1/models');
    const j = await r.json();
    modelSel.innerHTML = '';
    (j.data || []).forEach(m => {
      const o = document.createElement('option');
      o.value = m.id; o.textContent = m.id;
      modelSel.appendChild(o);
    });
  } catch (e) { modelSel.innerHTML = '<option>sign-in required</option>'; }
}
loadModels();

function addMsg(role, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  const who = document.createElement('div');
  who.className = 'who'; who.textContent = role === 'user' ? 'You' : 'MyMilo';
  const body = document.createElement('div');
  body.className = 'body'; body.textContent = text;
  d.append(who, body);
  // Per-message actions (like ChatGPT/Claude): copy + export this message.
  if (role === 'assistant' && text !== '…') {
    const actions = document.createElement('div');
    actions.className = 'msg-actions';
    const copyBtn = document.createElement('button');
    copyBtn.type = 'button'; copyBtn.className = 'icon-btn';
    copyBtn.title = 'Copy'; copyBtn.textContent = '⧉';
    copyBtn.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(text); copyBtn.textContent = '✓'; }
      catch (e) { copyBtn.textContent = '✕'; }
      setTimeout(() => { copyBtn.textContent = '⧉'; }, 1200);
    });
    const expBtn = document.createElement('button');
    expBtn.type = 'button'; expBtn.className = 'icon-btn';
    expBtn.title = 'Export this answer'; expBtn.textContent = '⤓';
    expBtn.addEventListener('click', async () => {
      const fmt = await pickFormat();
      if (fmt) exportChat(fmt, [{role, content: text}]);
    });
    actions.append(copyBtn, expBtn);
    d.appendChild(actions);
  }
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}

const micBtn = document.getElementById('mic');
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!SpeechRec) {
  micBtn.style.display = 'none'; // no voice input on this browser
} else {
  // iOS Safari hardening: fresh instance per tap, continuous + auto-restart,
  // user-visible errors. Reusing one instance is flaky on iPhone.
  let rec = null;
  let wantRec = false;
  let baseText = '';
  const stopUi = () => {
    wantRec = false;
    micBtn.classList.remove('rec');
    micBtn.textContent = '🎙';
  };
  const startRec = () => {
    rec = new SpeechRec();
    rec.lang = 'en-US';
    rec.interimResults = true;
    rec.continuous = true; // iOS stops after pauses unless continuous
    rec.onresult = (event) => {
      let interim = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const transcript = event.results[i][0].transcript;
        if (event.results[i].isFinal) baseText += transcript + ' ';
        else interim += transcript;
      }
      input.value = (baseText + interim).trim();
    };
    rec.onend = () => {
      // iOS fires onend spontaneously — restart if user still wants it.
      if (wantRec) { try { rec.start(); } catch (e) { stopUi(); } }
      else stopUi();
    };
    rec.onerror = (event) => {
      if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
        input.placeholder = 'Mic blocked — allow microphone in Settings';
      }
      stopUi();
    };
    try { rec.start(); }
    catch (e) { stopUi(); }
  };
  micBtn.addEventListener('click', () => {
    if (wantRec) { wantRec = false; if (rec) rec.stop(); return; }
    // Fresh dictation = fresh input. Clear any leftover text.
    input.value = '';
    baseText = '';
    wantRec = true;
    micBtn.classList.add('rec');
    micBtn.textContent = '⏹';
    startRec();
  });
  // Stop dictation and reset when the message is sent.
  form.addEventListener('submit', () => {
    if (wantRec) { wantRec = false; if (rec) try { rec.stop(); } catch (e) {} }
    baseText = '';
  });
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  addMsg('user', text);
  addMsg('assistant', '…');
  const thinking = log.lastChild;
  // Track messages for export.
  if (!window.chatMessages) window.chatMessages = [];
  window.chatMessages.push({role: 'user', content: text});
  const body = {
    model: modelSel.value,
    messages: [{role: 'user', content: text}],
  };
  if (currentSessionId) body.session_id = currentSessionId;
  if (document.getElementById('userag').checked) {
    body.rag = {enabled: true, top_k: 5};
  }
  try {
    const r = await fetch('/v1/chat/completions', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body),
    });
    const j = await r.json();
    thinking.remove();
    if (!r.ok) {
      addMsg('assistant', 'Error: ' + (j.error ? j.error.message : r.status));
    } else {
      const c = (j.choices && j.choices[0] && j.choices[0].message) || {};
      let out = c.content || JSON.stringify(j);
      if (j.background_job_id) {
        pollBackgroundJob(j.background_job_id);
      }
      if (j.active_skill) {
        out = '🛠 ' + j.active_skill + '\n\n' + out;
      }
      if (j.citation_check && !j.citation_check.ok) {
        out += '\n\n⚠ unverified citations: ' +
          j.citation_check.unresolved.map(u => `${u.filename} chunk ${u.chunk}`).join(', ');
      }
      // Adopt server session id (first message creates it).
      if (j.session_id && !currentSessionId) {
        currentSessionId = j.session_id;
        loadSessions();
      }
      window.chatMessages.push({role: 'assistant', content: out});
      addMsg('assistant', out);
    }
  } catch (err) {
    thinking.remove();
    const friendly = /sign-in required|server hiccup/i.test(err.message || '');
    addMsg('assistant', friendly ? err.message : 'Request failed: ' + err.message);
  }
});

// ── background job polling ──────────────────────────────────────
// After a background job starts, poll for its result and drop it in chat.
let bgPollTimer = null;
function pollBackgroundJob(jobId) {
  if (bgPollTimer) clearInterval(bgPollTimer);
  const started = Date.now();
  bgPollTimer = setInterval(async () => {
    if (Date.now() - started > 10 * 60 * 1000) { clearInterval(bgPollTimer); return; }
    try {
      const r = await fetch('/v1/jobs/' + jobId + '/runs');
      const j = await r.json();
      const runs = j.runs || j.data || [];
      const done = runs.find(x => x.status === 'completed' || x.status === 'failed');
      if (done) {
        clearInterval(bgPollTimer);
        const out = done.status === 'completed'
          ? '✅ Background task done:\n\n' + (done.result_summary || '(no summary)')
          : '❌ Background task failed: ' + (done.error || 'unknown error');
        addMsg('assistant', out);
      }
    } catch (e) { /* keep polling */ }
  }, 5000);
}
// Hook into the chat response handler above: if the response included a
// background_job_id, start polling.


document.getElementById('clear').addEventListener('click', () => {
  log.innerHTML = '';
  window.chatMessages = [];
  currentSessionId = null;
  document.getElementById('sessionSel').value = '';
});

// ── Session memory UI ──────────────────────────────────────
let currentSessionId = null;

async function loadSessions() {
  const sel = document.getElementById('sessionSel');
  try {
    const r = await fetch('/v1/sessions');
    const j = await r.json();
    const cur = sel.value;
    sel.innerHTML = '<option value="">New chat</option>';
    (j.sessions || []).forEach(s => {
      const o = document.createElement('option');
      o.value = s.id;
      const d = new Date(s.updated_at * 1000).toLocaleDateString();
      o.textContent = `${s.title.slice(0, 40)} (${d})`;
      sel.appendChild(o);
    });
    if (currentSessionId) sel.value = currentSessionId;
    else sel.value = cur;
  } catch (e) { /* sessions unavailable */ }
}
loadSessions();

document.getElementById('sessionSel').addEventListener('change', async (e) => {
  const sid = e.target.value;
  log.innerHTML = '';
  window.chatMessages = [];
  if (!sid) { currentSessionId = null; return; }
  currentSessionId = sid;
  try {
    const r = await fetch('/v1/sessions/' + sid);
    const j = await r.json();
    (j.messages || []).forEach(m => {
      if (m.role === 'user' || m.role === 'assistant') {
        window.chatMessages.push({role: m.role, content: m.content});
        addMsg(m.role, m.content);
      }
    });
  } catch (err) { addMsg('assistant', 'Could not load chat history.'); }
});

// ── Export (per-message + full chat) ─────────────────────────
async function exportChat(fmt, msgs) {
  msgs = msgs || window.chatMessages || [];
  if (!msgs.length) { alert('Nothing to export yet.'); return; }
  // Format picker for full-chat export (fmt may be null from toolbar).
  if (!fmt) {
    fmt = await pickFormat();
    if (!fmt) return;
  }
  try {
    const r = await fetch('/v1/export', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({messages: msgs, format: fmt}),
    });
    if (!r.ok) {
      const j = await r.json().catch(() => ({}));
      alert('Export failed: ' + (j.detail || r.status));
      return;
    }
    const blob = await r.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    const ext = {md: 'md', html: 'html', docx: 'docx', csv: 'csv'}[fmt] || fmt;
    a.download = 'milo-export.' + ext;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  } catch (e) { alert('Export failed: ' + e.message); }
}
// Small format picker sheet (Apple-style action sheet).
function pickFormat() {
  return new Promise((resolve) => {
    const sheet = document.createElement('div');
    sheet.className = 'format-sheet';
    sheet.innerHTML = `
      <div class="sheet-card">
        <div class="sheet-title">Export chat as</div>
        <button data-fmt="md">Markdown (.md)</button>
        <button data-fmt="html">Web page (.html)</button>
        <button data-fmt="docx">Word (.docx)</button>
        <button data-fmt="csv">Spreadsheet (.csv)</button>
        <button class="sheet-cancel">Cancel</button>
      </div>`;
    const done = (fmt) => { sheet.remove(); resolve(fmt || null); };
    sheet.addEventListener('click', (e) => {
      if (e.target === sheet) return done(null);
      const b = e.target.closest('button');
      if (!b) return;
      if (b.classList.contains('sheet-cancel')) return done(null);
      done(b.dataset.fmt);
    });
    document.body.appendChild(sheet);
  });
}
// Toolbar: full-chat export button.
const fullExportBtn = document.createElement('button');
fullExportBtn.type = 'button'; fullExportBtn.className = 'icon-btn';
fullExportBtn.title = 'Export full chat'; fullExportBtn.textContent = '⤓';
fullExportBtn.addEventListener('click', () => exportChat(null));
document.querySelector('.chat-toolbar').appendChild(fullExportBtn);
// Toolbar: delete current chat/thread button.
const delChatBtn = document.createElement('button');
delChatBtn.type = 'button'; delChatBtn.className = 'icon-btn';
delChatBtn.title = 'Delete this chat'; delChatBtn.textContent = '🗑';
delChatBtn.addEventListener('click', async () => {
  const sid = currentSessionId;
  if (!sid) { alert('No active chat to delete.'); return; }
  if (!confirm('Delete this chat? This cannot be undone.')) return;
  try {
    const r = await fetch('/v1/sessions/' + encodeURIComponent(sid), {method: 'DELETE'});
    if (!r.ok) { alert('Delete failed: ' + r.status); return; }
    window.chatMessages = [];
    currentSessionId = null;
    log.innerHTML = '';
    addMsg('assistant', 'Chat deleted. Starting fresh — what can I do for you?');
  } catch (e) { alert('Delete failed: ' + e.message); }
});
document.querySelector('.chat-toolbar').appendChild(delChatBtn);
</script>
{% endblock %}
